name: Frontend Scaffold Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-scaffold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install dependencies and build WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache-dependency-path: frontend/src/wasm/diff/go.sum

      - name: Build locked WASM module
        run: ./build.sh
        working-directory: frontend/src/wasm/diff

      - name: Verify Go lock files are stable
        run: git diff --exit-code -- src/wasm/diff/go.mod src/wasm/diff/go.sum

      - name: Record deployment status
        run: echo "::notice::Next.js deployment is disabled because the frontend source tree is incomplete; this workflow validates only the reproducible scaffold and WASM build."
