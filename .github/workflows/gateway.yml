name: API Gateway CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/gateway.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.43.x

      - name: Cache Deno dependencies
        run: deno cache main.ts

      - name: Lint code
        run: deno lint

      - name: Format check
        run: deno fmt --check

      - name: Type check
        run: deno check main.ts

      - name: Run tests
        run: deno test --allow-net --allow-read --allow-env
        env:
          ANTRAGSGRUEN_BASE_URL: http://localhost:8080
          RARIMO_ISSUER: https://auth.rarimo.com
          JWT_AUDIENCE: antragsgruen-api-test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.43.x

      - name: Security audit
        run: |
          # Check for known vulnerabilities in dependencies
          deno cache --reload main.ts
          
          # Run static analysis
          deno lint --rules-include=no-unused-vars,no-unreachable

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api-gateway
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

